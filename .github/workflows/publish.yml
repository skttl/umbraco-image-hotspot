name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Umbraco.Community.ImageHotspot/Client/package-lock.json
      - name: Validate tag, dependency major and branch ancestry
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-version.mjs "$RELEASE_TAG"
      - run: node --test scripts/release-version.test.mjs
      - run: npm ci
        working-directory: src/Umbraco.Community.ImageHotspot/Client
      - run: npm run check && npm run build
        working-directory: src/Umbraco.Community.ImageHotspot/Client
      - name: Build solution at tag version
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build Umbraco.Community.ImageHotspot.slnx -c Release -p:Version="$PACKAGE_VERSION"
      - run: dotnet test tests/Umbraco.Community.ImageHotspot.Tests/Umbraco.Community.ImageHotspot.Tests.csproj -c Release --no-build
      - run: npx playwright install --with-deps chromium
        working-directory: src/Umbraco.Community.ImageHotspot/Client
      - shell: pwsh
        run: ./scripts/test-e2e.ps1
      - name: Pack tag version
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/Umbraco.Community.ImageHotspot/Umbraco.Community.ImageHotspot.csproj -c Release --no-build -o artifacts -p:Version="$PACKAGE_VERSION"
      - name: Inspect package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/verify-package.ps1 -PackagePath "artifacts/Umbraco.Community.ImageHotspot.$env:PACKAGE_VERSION.nupkg" -Version $env:PACKAGE_VERSION
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push verified package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet nuget push "artifacts/Umbraco.Community.ImageHotspot.$PACKAGE_VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
