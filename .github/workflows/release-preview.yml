name: Release Preview Package

on:
  push:
    branches:
      - "v[0-9]*/preview"

jobs:
  release:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Prepare release
      id: prepare
      run: |
        # Determine latest released version from changelog (ignore prerelease tags)
        LATEST=$(grep -m1 "^## \[[0-9]" CHANGELOG.md | sed 's/## \[\(.*\)\].*/\1/')
        MAJOR=$(echo "$LATEST" | cut -d. -f1)
        MINOR=$(echo "$LATEST" | cut -d. -f2)
        PATCH=$(echo "$LATEST" | cut -d. -f3)

        # Check for optional bump level marker in [Unreleased] section
        BUMP=$(awk "/^## \[Unreleased\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md | grep -o '<!-- bump: \(minor\|major\) -->' | sed 's/<!-- bump: \(.*\) -->/\1/')
        if [ "$BUMP" = "major" ]; then
          BASE_VERSION="$((MAJOR + 1)).0.0"
        elif [ "$BUMP" = "minor" ]; then
          BASE_VERSION="$MAJOR.$((MINOR + 1)).0"
        else
          BASE_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
        fi
        DATE=$(date +%Y-%m-%d)

        # Enforce branch major matches computed version major
        BRANCH="${GITHUB_REF#refs/heads/}"
        BRANCH_MAJOR=$(echo "$BRANCH" | sed -n 's|^v\([0-9]\+\)/preview$|\1|p')
        NEW_MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
        if [ "$NEW_MAJOR" != "$BRANCH_MAJOR" ]; then
          echo "::error::Version major ($NEW_MAJOR) does not match branch major ($BRANCH_MAJOR). Add <!-- bump: major --> to [Unreleased] or check you are on the correct branch."
          exit 1
        fi

        # Find the next preview suffix (preview001, preview002, ...)
        EXISTING=$(git tag --list "${BASE_VERSION}-preview*" | sort | tail -1)
        if [ -z "$EXISTING" ]; then
          SUFFIX="preview001"
        else
          LAST_NUM=$(echo "$EXISTING" | sed "s/.*preview//")
          SUFFIX=$(printf "preview%03d" $((10#$LAST_NUM + 1)))
        fi
        VERSION="${BASE_VERSION}-${SUFFIX}"

        USE_COMMITS=false
        if grep -q "^## \[Unreleased\]" CHANGELOG.md; then
          UNRELEASED_CONTENT=$(awk "/^## \[Unreleased\]/{found=1; next} found && /^## \[/{exit} found && /[^[:space:]]/{print}" CHANGELOG.md)
          if [ -z "$UNRELEASED_CONTENT" ]; then
            USE_COMMITS=true
          fi
        else
          USE_COMMITS=true
        fi

        if [ "$USE_COMMITS" = "true" ]; then
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" HEAD -- src/ImageHotspot/)
          else
            COMMITS=$(git log --pretty=format:"- %s" "${LAST_TAG}..HEAD" -- src/ImageHotspot/)
          fi

          if [ -z "$COMMITS" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          NOTES="### Changes"$'\n'"$COMMITS"

          if grep -q "^## \[Unreleased\]" CHANGELOG.md; then
            # Replace the empty [Unreleased] section with versioned entry + fresh [Unreleased]
            _NOTES="$NOTES" python3 -c "import os,sys; v,d,n=sys.argv[1],sys.argv[2],os.environ['_NOTES']; c=open('CHANGELOG.md').read(); c=c.replace('## [Unreleased]','## [Unreleased]\n\n## ['+v+'] - '+d+'\n\n'+n,1); open('CHANGELOG.md','w').write(c)" "$VERSION" "$DATE"
          else
            # No [Unreleased] at all — prepend versioned entry + fresh [Unreleased]
            _NOTES="$NOTES" python3 -c "import os,sys,re; v,d,n=sys.argv[1],sys.argv[2],os.environ['_NOTES']; c=open('CHANGELOG.md').read(); h='## [Unreleased]\n\n## ['+v+'] - '+d+'\n\n'+n+'\n\n'; c=re.sub(r'(?=^## \\[)',h,c,count=1,flags=re.MULTILINE); open('CHANGELOG.md','w').write(c)" "$VERSION" "$DATE"
          fi
        else
          # [Unreleased] has content — strip bump marker, stamp version, prepend fresh [Unreleased]
          sed -i '/<!-- bump: \(minor\|major\) -->/d' CHANGELOG.md
          sed -i "s/^## \[Unreleased\]/## [$VERSION] - $DATE/" CHANGELOG.md
          python3 -c "import sys; v=sys.argv[1]; c=open('CHANGELOG.md').read(); c=c.replace('## ['+v+']','## [Unreleased]\n\n## ['+v+']',1); open('CHANGELOG.md','w').write(c)" "$VERSION"
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
        fi

        echo "should_release=true" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "notes<<EOF" >> $GITHUB_OUTPUT
        echo "$NOTES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Commit changelog and create tag
      if: steps.prepare.outputs.should_release == 'true'
      run: |
        VERSION=${{ steps.prepare.outputs.version }}
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add CHANGELOG.md
        git commit -m "Release $VERSION"
        git tag "$VERSION"
        git push origin HEAD:${GITHUB_REF#refs/heads/} --tags

    - name: Setup .NET
      if: steps.prepare.outputs.should_release == 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup Node.js
      if: steps.prepare.outputs.should_release == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install client dependencies
      if: steps.prepare.outputs.should_release == 'true'
      run: npm ci
      working-directory: src/ImageHotspot/Client

    - name: Type-check client
      if: steps.prepare.outputs.should_release == 'true'
      run: npm run check
      working-directory: src/ImageHotspot/Client

    - name: Build client
      if: steps.prepare.outputs.should_release == 'true'
      run: npm run build
      working-directory: src/ImageHotspot/Client

    - name: Run C# unit tests
      if: steps.prepare.outputs.should_release == 'true'
      run: dotnet test src/ImageHotspot.Tests/ImageHotspot.Tests.csproj -c Release

    - name: Build & Pack
      if: steps.prepare.outputs.should_release == 'true'
      run: dotnet pack src/ImageHotspot/ImageHotspot.csproj -c Release /p:Version=${{ steps.prepare.outputs.version }}

    - name: Push to NuGet
      if: steps.prepare.outputs.should_release == 'true'
      run: dotnet nuget push **/*.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json

    - name: Create GitHub Release
      if: steps.prepare.outputs.should_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.prepare.outputs.version }}
        name: ${{ steps.prepare.outputs.version }}
        body: ${{ steps.prepare.outputs.notes }}
        draft: false
        prerelease: true